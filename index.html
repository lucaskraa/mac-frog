<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mac Frog</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111;font-family:Arial,sans-serif}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:white;background:#111}
  </style>
</head>
<body>
<div id="status">Carregando o novo mapa de Mac Frog...</div>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const [gameResponse, roomResponse, blueprintsResponse, connectorsResponse, coreResponse, visualResponse, v9Response, v9VisualResponse, v9BackdropResponse, v9FxResponse, v10Response, v10VisualResponse, v10TerrainResponse, v10ParallaxResponse] = await Promise.all([
      fetch('./game_v25.html', {cache:'no-store'}),
      fetch('./scenario_room1_v6.js', {cache:'no-store'}),
      fetch('./area1_blueprints_v8.js', {cache:'no-store'}),
      fetch('./area1_connectors_v8.js', {cache:'no-store'}),
      fetch('./scenario_room1_v8.js', {cache:'no-store'}),
      fetch('./scenario_room1_v8_visual.js', {cache:'no-store'}),
      fetch('./scenario_room1_v9.js', {cache:'no-store'}),
      fetch('./scenario_room1_v9_visual.js', {cache:'no-store'}),
      fetch('./scenario_room1_v9_backdrop.js', {cache:'no-store'}),
      fetch('./scenario_room1_v9_fx.js', {cache:'no-store'}),
      fetch('./scenario_room1_v10.js', {cache:'no-store'}),
      fetch('./scenario_room1_v10_visual.js', {cache:'no-store'}),
      fetch('./scenario_room1_v10_terrain.js', {cache:'no-store'}),
      fetch('./scenario_room1_v10_parallax.js', {cache:'no-store'})
    ]);

    if (!gameResponse.ok) throw new Error('game_v25.html não carregou');
    if (!roomResponse.ok) throw new Error('scenario_room1_v6.js não carregou');
    if (!blueprintsResponse.ok) throw new Error('area1_blueprints_v8.js não carregou');
    if (!connectorsResponse.ok) throw new Error('area1_connectors_v8.js não carregou');
    if (!coreResponse.ok) throw new Error('scenario_room1_v8.js não carregou');
    if (!visualResponse.ok) throw new Error('scenario_room1_v8_visual.js não carregou');
    if (!v9Response.ok) throw new Error('scenario_room1_v9.js não carregou');
    if (!v9VisualResponse.ok) throw new Error('scenario_room1_v9_visual.js não carregou');
    if (!v9BackdropResponse.ok) throw new Error('scenario_room1_v9_backdrop.js não carregou');
    if (!v9FxResponse.ok) throw new Error('scenario_room1_v9_fx.js não carregou');
    if (!v10Response.ok) throw new Error('scenario_room1_v10.js não carregou');
    if (!v10VisualResponse.ok) throw new Error('scenario_room1_v10_visual.js não carregou');
    if (!v10TerrainResponse.ok) throw new Error('scenario_room1_v10_terrain.js não carregou');
    if (!v10ParallaxResponse.ok) throw new Error('scenario_room1_v10_parallax.js não carregou');

    let game = await gameResponse.text();
    const roomV6 = await roomResponse.text();
    const blueprintV8 = await blueprintsResponse.text();
    const connectorsV8 = await connectorsResponse.text();
    const coreV8 = await coreResponse.text();
    const visualV8 = await visualResponse.text();
    const coreV9 = await v9Response.text();
    const visualV9 = await v9VisualResponse.text();
    const backdropV9 = await v9BackdropResponse.text();
    const fxV9 = await v9FxResponse.text();
    const coreV10 = await v10Response.text();
    const artV10 = await v10VisualResponse.text();
    const terrainV10 = await v10TerrainResponse.text();
    const parallaxV10 = await v10ParallaxResponse.text();

    game = game.replace(
      'const WORLD_WIDTH = 3000;',
      'const WORLD_WIDTH = 4800;'
    );

    game = game.replace(
      'mac.x > 2420',
      'mac.x > 4050'
    );

    const bootMarker = '    bootGame();';
    if (!game.includes(bootMarker)) {
      throw new Error('Ponto de inicialização não encontrado');
    }

    game = game.replace(
      bootMarker,
      '\n' + roomV6 + '\n\n' + blueprintV8 + '\n\n' + connectorsV8 + '\n\n' + coreV8 + '\n\n' + visualV8 + '\n\n' + coreV9 + '\n\n' + visualV9 + '\n\n' + backdropV9 + '\n\n' + fxV9 + '\n\n' + coreV10 + '\n\n' + artV10 + '\n\n' + terrainV10 + '\n\n' + parallaxV10 + '\n\n' + bootMarker
    );

    document.open();
    document.write(game);
    document.close();
  } catch (error) {
    status.textContent = 'Erro ao carregar o jogo: ' + error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
