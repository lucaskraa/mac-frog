<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mac Frog</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111;font-family:Arial,sans-serif}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:white;background:#111}
  </style>
</head>
<body>
<div id="status">Carregando Mangue das Ruínas...</div>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const [gameResponse, patchResponse] = await Promise.all([
      fetch('./game_v25.html', {cache:'no-store'}),
      fetch('./cenario1.txt', {cache:'no-store'})
    ]);

    if (!gameResponse.ok) throw new Error('game_v25.html não carregou');
    if (!patchResponse.ok) throw new Error('cenario1.txt não carregou');

    let game = await gameResponse.text();
    const patch = await patchResponse.text();

    game = game.replace(
      'const WORLD_WIDTH = 3000;',
      'const WORLD_WIDTH = 4800;'
    );

    game = game.replace(
      'const WORLD_HEIGHT = 900;',
      'const WORLD_HEIGHT = 1700;'
    );

    game = game.replace(
      'mac.x > 2420',
      'mac.x > 4050'
    );

    const bootMarker = '    bootGame();';
    if (!game.includes(bootMarker)) {
      throw new Error('Ponto de inicialização não encontrado');
    }

    game = game.replace(
      bootMarker,
      '\n' + patch + '\n\n' + bootMarker
    );

    document.open();
    document.write(game);
    document.close();
  } catch (error) {
    status.textContent = 'Erro ao carregar o jogo: ' + error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
