const ANIMS = {
  idle: { row: 0, count: 8, fps: 6 },
  walk: { row: 1, count: 8 },
  run:  { row: 2, count: 8 },
  jump: { row: 3, count: 8 }
};

const keys = {};
const justPressed = new Set();

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (!keys[k]) justPressed.add(k);
  keys[k] = true;
  if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) {
    e.preventDefault();
  }
});

addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

function held(...arr) {
  return arr.some(k => keys[k]);
}

function pressed(...arr) {
  return arr.some(k => justPressed.has(k));
}

const mac = {
  x: 220,
  y: GROUND - 122,
  w: 62,
  h: 122,

  vx: 0,
  vy: 0,
  facing: 1,

  grounded: true,
  coyote: 0,
  jumpBuffer: 0,

  anim: "idle",
  frame: 0,
  idleClock: 0,
  locomotionPhase: 0
};

function reset() {
  mac.x = 220;
  mac.y = GROUND - mac.h;
  mac.vx = 0;
  mac.vy = 0;
  mac.facing = 1;
  mac.grounded = true;
  mac.coyote = 0;
  mac.jumpBuffer = 0;
  mac.anim = "idle";
  mac.frame = 0;
  mac.idleClock = 0;
  mac.locomotionPhase = 0;
}

function chooseGroundAnim() {
  const speed = Math.abs(mac.vx);

  // histerese para não ficar trocando nervosamente
  if (mac.anim === "run" && speed > 3.85) return "run";
  if (mac.anim === "walk" && speed > 0.20 && speed < 4.85) return "walk";

  if (speed >= 4.55) return "run";
  if (speed >= 0.35) return "walk";
  return "idle";
}

function chooseJumpFrame() {
  // 8 quadros com zonas largas para não piscar
  if (mac.vy < -11) return 0; // saída do chão
  if (mac.vy < -7)  return 1;
  if (mac.vy < -3)  return 2;
  if (mac.vy <  0)  return 3; // perto do ápice subindo
  if (mac.vy <  3)  return 4; // ápice/começo da queda
  if (mac.vy <  7)  return 5;
  if (mac.vy < 11)  return 6; // queda
  return 7; // aterrissagem
}

function updateAnimation(dt, dx) {
  if (!mac.grounded) {
    mac.anim = "jump";
    mac.frame = chooseJumpFrame();
    return;
  }

  const next = chooseGroundAnim();

  if (next !== mac.anim) {
    const oldAnim = mac.anim;
    mac.anim = next;

    // mantém a fase entre walk e run
    if ((oldAnim === "walk" || oldAnim === "run") && (next === "walk" || next === "run")) {
      // mantém locomotionPhase
    } else if (next === "idle") {
      mac.frame = 0;
      mac.idleClock = 0;
    }
  }

  if (mac.anim === "idle") {
    mac.idleClock += dt;
    const frameTime = 1000 / ANIMS.idle.fps;
    while (mac.idleClock >= frameTime) {
      mac.idleClock -= frameTime;
      mac.frame = (mac.frame + 1) % ANIMS.idle.count;
    }
    return;
  }

  // animação por distância: bem mais natural
  const pixelsPerCycle = mac.anim === "walk" ? 112 : 158;
  mac.locomotionPhase = (mac.locomotionPhase + Math.abs(dx) / pixelsPerCycle) % 1;
  mac.frame = Math.floor(mac.locomotionPhase * ANIMS[mac.anim].count) % ANIMS[mac.anim].count;
}

function update() {
  if (pressed("r")) reset();

  const left = held("a", "arrowleft");
  const right = held("d", "arrowright");
  const sprint = held("shift");

  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  if (dir !== 0) mac.facing = dir;

  const maxSpeed = sprint ? 6.55 : 4.2;
  const accel = mac.grounded ? 0.115 : 0.055;

  if (dir !== 0) {
    const target = dir * maxSpeed;
    mac.vx += (target - mac.vx) * accel;
  } else {
    mac.vx *= mac.grounded ? 0.76 : 0.975;
    if (Math.abs(mac.vx) < 0.03) mac.vx = 0;
  }

  // coyote time
  if (mac.grounded) mac.coyote = 8;
  else if (mac.coyote > 0) mac.coyote--;

  // jump buffer
  if (pressed(" ", "w", "arrowup")) {
    mac.jumpBuffer = 8;
  } else if (mac.jumpBuffer > 0) {
    mac.jumpBuffer--;
  }

  if (mac.jumpBuffer > 0 && mac.coyote > 0) {
    mac.vy = -14.4;
    mac.grounded = false;
    mac.coyote = 0;
    mac.jumpBuffer = 0;
  }

  // salto variável
  if (!held(" ", "w", "arrowup") && mac.vy < -5.2) {
    mac.vy += 0.9;
  }

  mac.vy += 0.70;

  const oldX = mac.x;
  mac.x += mac.vx;
  mac.y += mac.vy;

  if (mac.y + mac.h >= GROUND) {
    mac.y = GROUND - mac.h;
    mac.vy = 0;
    mac.grounded = true;
  } else {
    mac.grounded = false;
  }

  if (mac.x < 24) {
    mac.x = 24;
    mac.vx = 0;
  }
  if (mac.x + mac.w > W - 24) {
    mac.x = W - 24 - mac.w;
    mac.vx = 0;
  }

  const dx = mac.x - oldX;
  updateAnimation(16.67, dx);

  justPressed.clear();
}

function drawWorld() {
  ctx.fillStyle = "#202428";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#2c3136";
  ctx.lineWidth = 2;
  for (let x = 100; x < W; x += 100) {
    ctx.beginPath();
    ctx.moveTo(x, 90);
    ctx.lineTo(x, GROUND);
    ctx.stroke();
  }

  ctx.fillStyle = "#6c6f74";
  ctx.fillRect(0, GROUND, W, H - GROUND);

  ctx.fillStyle = "#8a8d91";
  ctx.fillRect(0, GROUND, W, 9);

  ctx.strokeStyle = "#50545a";
  ctx.lineWidth = 3;
  for (let x = 0; x < W; x += 90) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND + 45);
    ctx.lineTo(x + 60, GROUND + 45);
    ctx.stroke();
  }
}

function drawMac() {
  const a = ANIMS[mac.anim];
  const sx = mac.frame * CELL;
  const sy = a.row * CELL;

  const drawSize = 214;
  const feetX = mac.x + mac.w / 2;
  const feetY = mac.y + mac.h + 2;

  ctx.save();
  ctx.translate(feetX, feetY);

  if (mac.facing < 0) ctx.scale(-1, 1);

  // inclinação leve na corrida
  if (mac.anim === "run") {
    ctx.rotate(mac.facing * 0.012);
  }

  ctx.drawImage(
    sheet,
    sx, sy, CELL, CELL,
    -drawSize / 2,
    -drawSize + 8,
    drawSize,
    drawSize
  );

  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,.38)";
  ctx.fillRect(18, 18, 395, 105);

  ctx.fillStyle = "#f0f0f0";
  ctx.font = "bold 24px Arial";
  ctx.fillText("MAC FROG — TESTE FLUIDO", 32, 52);

  ctx.font = "16px Arial";
  ctx.fillStyle = "#cfd4d8";
  ctx.fillText("Animação: " + mac.anim.toUpperCase() + " | frame " + (mac.frame + 1), 32, 82);
  ctx.fillText("Passada por distância + base alinhada", 32, 106);
}

function loop() {
  update();
  drawWorld();
  if (sheet.complete) drawMac();
  drawHUD();
  requestAnimationFrame(loop);
}

reset();
sheet.onload = () => requestAnimationFrame(loop);
</script>
